name: Phase 1 CI

on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://arrow_app:arrow_app_dev@localhost:5432/arrow
      MIGRATION_DATABASE_URL: postgres://arrow_migrator:arrow_migrator_dev@localhost:5432/arrow
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-access-secret-that-is-long-enough
      PII_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_ACCESS_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30
      PLATFORM_ADMIN_EMAIL: platform-admin@example.test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev
          POSTGRES_DB: arrow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arrow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create database roles
        run: psql -h localhost -U postgres -d arrow -f docker/postgres/init/001-roles.sql
        env:
          PGPASSWORD: postgres_dev
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm audit
